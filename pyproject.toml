[project]
name = "hk-us-stock-workbench"
version = "1.0.0"
description = "本机港美股日终研究工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars==4.13.3",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "keyring>=25.6,<26",
    "pandas==3.1.1",
    "uvicorn[standard]==0.54.0",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
